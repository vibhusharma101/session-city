<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session City</title>
<style>
  :root {
    --bg: #0b0e17;
    --panel: #121726;
    --line: #242b3f;
    --text: #e6e9f2;
    --muted: #8a93ab;
    --accent: #ffd27a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  canvas.pointing { cursor: pointer; }
  .glass { background: rgba(18, 23, 38, .86); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(6px); }
  header { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap;
    gap: 8px; align-items: center; pointer-events: none; }
  header > * { pointer-events: auto; }
  .brand { font-weight: 700; font-size: 15px; padding: 7px 12px; }
  .stats { padding: 7px 12px; color: var(--muted); }
  .stats b { color: var(--text); font-weight: 600; }
  .stats .needs { color: var(--accent); }
  .spacer { flex: 1; }
  select, button { font: inherit; color: var(--text); background: rgba(18, 23, 38, .86);
    border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; cursor: pointer; }
  button:hover, select:hover { border-color: #3a4462; }
  #legend { position: fixed; left: 12px; bottom: 12px; padding: 10px 12px; font-size: 12px;
    display: grid; grid-template-columns: auto auto; gap: 4px 14px; max-width: calc(100% - 24px); }
  #legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin-right: 6px; vertical-align: -1px; }
  #legend .muted { color: var(--muted); }
  #privacy { position: fixed; right: 12px; bottom: 12px; padding: 7px 12px; font-size: 12px;
    color: var(--muted); }
  #tip { position: fixed; pointer-events: none; padding: 6px 10px; font-size: 12px; display: none;
    max-width: 260px; }
  #empty { position: fixed; inset: 0; display: none; place-items: center; text-align: center;
    color: var(--muted); padding: 24px; }
  #panel { position: fixed; top: 0; right: 0; height: 100%; width: min(400px, 100%);
    background: var(--panel); border-left: 1px solid var(--line); transform: translateX(100%);
    transition: transform .18s ease; overflow-y: auto; padding: 20px; z-index: 5; }
  #panel.open { transform: none; }
  #panel h2 { margin: 6px 0 4px; font-size: 18px; line-height: 1.3; }
  #panel .sub { color: var(--muted); font-size: 12px; word-break: break-all; }
  #panel .close { position: absolute; top: 14px; right: 14px; padding: 2px 9px; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .pill.working { border-color: #6fdc8c; color: #6fdc8c; }
  .pill.waiting { border-color: var(--accent); color: var(--accent); }
  .pill.open { border-color: #7aa6d6; color: #7aa6d6; }
  .story { display: block; margin-top: 14px; padding: 10px 12px; border-radius: 10px; text-align: center;
    background: var(--accent); color: #1a1406; font-weight: 600; text-decoration: none; }
  .story:hover { filter: brightness(1.06); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0; }
  .stat { background: #0f1320; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .stat .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .stat .v { font-size: 16px; font-weight: 600; }
  h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
    margin: 18px 0 8px; font-weight: 600; }
  .bar { display: grid; grid-template-columns: 120px 1fr 36px; gap: 8px; align-items: center;
    font-size: 12px; margin: 4px 0; }
  .bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { height: 6px; background: #0f1320; border-radius: 3px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 3px; }
  .bar .n { text-align: right; color: var(--muted); }
  pre { background: #0f1320; border: 1px solid var(--line); border-radius: 8px; padding: 10px;
    font-size: 12px; white-space: pre-wrap; word-break: break-all; margin: 0 0 8px; }
  @media (max-width: 600px) {
    #legend, #privacy { display: none; }
  }
</style>
</head>
<body>
<canvas id="city"></canvas>

<header>
  <div class="brand glass">Session City</div>
  <div class="stats glass" id="stats">Loading…</div>
  <div class="spacer"></div>
  <select id="range" aria-label="Time range">
    <option value="all">All time</option>
    <option value="30">Last 30 days</option>
    <option value="7">Last 7 days</option>
    <option value="1">Last 24 hours</option>
  </select>
  <button id="fit" title="Fit city to screen">Fit</button>
</header>

<div id="legend" class="glass"></div>
<div id="privacy" class="glass">Local only · nothing leaves this machine</div>
<div id="tip" class="glass"></div>
<div id="empty"><div>
  <p style="font-size:16px;color:var(--text)">No sessions in this view.</p>
  <p>Session City reads Claude Code sessions from <code>~/.claude/projects</code>.<br>
  Start a Claude Code session, or widen the time range.</p>
</div></div>

<aside id="panel" aria-live="polite"></aside>

<script>
const TW = 64, TH = 32;   // iso tile size
const W2 = 22, D2 = 11;   // building half-width / half-depth
const BG = '#0b0e17';

const KINDS = {
  build:    { color: '#e0a458', label: 'Workshop',    desc: 'editing code' },
  research: { color: '#7aa6d6', label: 'Library',     desc: 'reading & searching' },
  shell:    { color: '#c47f6a', label: 'Factory',     desc: 'running commands' },
  web:      { color: '#6fc7b8', label: 'Observatory', desc: 'web & browser' },
  agents:   { color: '#b48ae6', label: 'HQ',          desc: 'dispatching subagents' },
  mcp:      { color: '#d6c36a', label: 'Exchange',    desc: 'MCP tools' },
  chat:     { color: '#e48aa0', label: 'Café',        desc: 'just talking' },
};
const STATUS = { working: 'Working', waiting: 'Needs you', open: 'Open · idle', closed: 'Closed' };
const LIT = { working: 0.8, waiting: 0.6, open: 0.5, closed: 0.06 };

const canvas = document.getElementById('city');
const ctx = canvas.getContext('2d');
const panel = document.getElementById('panel');
const tip = document.getElementById('tip');
let dpr = 1;
let city = null, buildings = [], districts = [], map = { cols: 0, rows: 0 };
let view = { x: 0, y: 0, s: 1 }, fitted = false;
let selectedId = null, hoverId = null;
let range = 'all';

// ---------- helpers ----------
function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
  return h >>> 0;
}
function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function mix(a, b, p) {
  const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  const c = [16, 8, 0].map((s) => Math.round(((x >> s) & 255) * (1 - p) + ((y >> s) & 255) * p));
  return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
}
const shade = (hex, f) => mix(hex, f < 0 ? '#000000' : '#ffffff', Math.abs(f));
const iso = (gx, gy) => [(gx - gy) * TW / 2, (gx + gy) * TH / 2];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const fmtNum = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n);
function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}
function span(a, b) {
  const m = Math.round((Date.parse(b) - Date.parse(a)) / 60000);
  return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
}
function poly(pts, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
}
function inPoly([x, y], pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

// ---------- layout ----------
function inRange(s) {
  if (range === 'all') return true;
  return Date.parse(s.lastActivity) >= Date.now() - Number(range) * 864e5;
}

function layout() {
  const ds = city.districts
    .map((d) => ({ name: d.name, list: d.sessions.filter(inRange) }))
    .filter((d) => d.list.length);
  const side = Math.max(2, ...ds.map((d) => Math.ceil(Math.sqrt(d.list.length))));
  const cell = side + 2;                       // two tiles of road between districts
  const cols = Math.max(1, Math.ceil(Math.sqrt(ds.length)));
  map = { cols: cols * cell + 1, rows: Math.ceil(ds.length / cols) * cell + 1 };
  buildings = [];
  districts = ds.map((d, i) => {
    const bx = (i % cols) * cell + 1, by = Math.floor(i / cols) * cell + 1;
    const n = Math.ceil(Math.sqrt(d.list.length));
    d.list.forEach((s, j) => buildings.push(makeBuilding(s, bx + (j % n), by + Math.floor(j / n))));
    return { name: d.name, bx, by, w: n, h: Math.ceil(d.list.length / n), count: d.list.length };
  });
  buildings.sort((a, b) => a.gx + a.gy - (b.gx + b.gy) || a.gx - b.gx);
  document.getElementById('empty').style.display = buildings.length ? 'none' : 'grid';
}

function makeBuilding(s, gx, gy) {
  const [cx, cy] = iso(gx + 0.5, gy + 0.5);
  const h = s.kind === 'chat' ? 18 : Math.min(230, 16 + 17 * Math.log2(1 + s.turns));
  const r = rng(hash(s.id));
  const rows = Math.max(1, Math.floor((h - 8) / 11));
  const rnd = Array.from({ length: rows * 4 }, r);
  const poly = [[cx - W2, cy], [cx - W2, cy - h], [cx, cy - D2 - h], [cx + W2, cy - h], [cx + W2, cy], [cx, cy + D2]];
  return { s, gx, gy, cx, cy, h, rows, rnd, poly, phase: r() * Math.PI * 2 };
}

// ---------- drawing ----------
function drawGround() {
  const { cols, rows } = map;
  poly([iso(0, 0), iso(cols, 0), iso(cols, rows), iso(0, rows)], '#121624');
  for (const d of districts) {
    poly([iso(d.bx - 0.15, d.by - 0.15), iso(d.bx + d.w + 0.15, d.by - 0.15),
          iso(d.bx + d.w + 0.15, d.by + d.h + 0.15), iso(d.bx - 0.15, d.by + d.h + 0.15)], '#1a2032', '#262e45');
    for (let x = 0; x < d.w; x++) for (let y = 0; y < d.h; y++) {
      const gx = d.bx + x, gy = d.by + y;
      poly([iso(gx + 0.08, gy + 0.08), iso(gx + 0.92, gy + 0.08), iso(gx + 0.92, gy + 0.92), iso(gx + 0.08, gy + 0.92)], '#1f2639');
    }
  }
}

function drawWindows(b, p0, p1, litP, faceShade) {
  const at = (u, v) => [p0[0] + (p1[0] - p0[0]) * u, p0[1] + (p1[1] - p0[1]) * u - v];
  const lit = faceShade < 0.3 ? '#ffd98a' : '#e8bf6e';
  for (let row = 0; row < b.rows; row++) {
    for (let c = 0; c < 2; c++) {
      const i = row * 4 + c + (p0[0] < b.cx ? 0 : 2);
      const u0 = 0.18 + c * 0.38, u1 = u0 + 0.22, v0 = 6 + row * 11, v1 = v0 + 6;
      poly([at(u0, v0), at(u1, v0), at(u1, v1), at(u0, v1)], b.rnd[i] < litP ? lit : 'rgba(8,10,18,.55)');
    }
  }
}

function drawBuilding(b, t) {
  const { s, cx, cy, h } = b;
  const live = s.status !== 'closed';
  const base = live ? KINDS[s.kind].color : mix(KINDS[s.kind].color, '#141826', 0.55);
  const L = [cx - W2, cy], R = [cx + W2, cy], T = [cx, cy - D2], B = [cx, cy + D2];
  const up = (p, dy = h) => [p[0], p[1] - dy];
  const top = cy - h;

  if (s.status === 'working') {
    ctx.fillStyle = `rgba(255,210,122,${0.14 + 0.08 * Math.sin(t / 400 + b.phase)})`;
    ctx.beginPath(); ctx.ellipse(cx, cy, 36, 18, 0, 0, Math.PI * 2); ctx.fill();
  }

  poly([L, B, up(B), up(L)], shade(base, -0.2));
  poly([B, R, up(R), up(B)], shade(base, -0.42));
  poly([up(L), up(T), up(R), up(B)], shade(base, 0.12));
  drawWindows(b, L, B, LIT[s.status], 0.2);
  drawWindows(b, B, R, LIT[s.status], 0.42);

  ctx.lineWidth = 2;
  switch (s.kind) {
    case 'build': { // construction crane
      const sway = live ? 3 * Math.sin(t / 600 + b.phase) : 0;
      ctx.strokeStyle = live ? '#f2c14e' : '#6b5a33';
      ctx.beginPath();
      ctx.moveTo(cx + 6, top - 2); ctx.lineTo(cx + 6, top - 32);
      ctx.moveTo(cx - 10, top - 30); ctx.lineTo(cx + 28, top - 30);
      ctx.moveTo(cx + 22, top - 30); ctx.lineTo(cx + 22, top - 16 + sway);
      ctx.stroke();
      ctx.fillStyle = ctx.strokeStyle; ctx.fillRect(cx + 19, top - 16 + sway, 6, 4);
      break;
    }
    case 'research': // pitched roof
      poly([up(L), up(T), up(R), [cx, top - 16]], shade(base, -0.1));
      poly([up(L), [cx, top - 16], up(R), up(B)], shade(base, 0.22));
      break;
    case 'shell': { // chimney + smoke
      poly([[cx + 4, top], [cx + 4, top - 20], [cx + 12, top - 20], [cx + 12, top]], shade(base, -0.5));
      if (live) for (let i = 0; i < 3; i++) {
        const p = (t / 1800 + i / 3 + b.phase) % 1;
        ctx.fillStyle = `rgba(170,178,196,${(1 - p) * 0.45})`;
        ctx.beginPath(); ctx.arc(cx + 8 + p * 12, top - 24 - p * 30, 3 + p * 6, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case 'web': // observatory dome
      ctx.fillStyle = shade(base, 0.3);
      ctx.beginPath(); ctx.ellipse(cx, top, 14, 7, 0, Math.PI, 0); ctx.arc(cx, top, 14, 0, Math.PI, true); ctx.fill();
      ctx.strokeStyle = shade(base, -0.4);
      ctx.beginPath(); ctx.moveTo(cx, top - 1); ctx.lineTo(cx + 10 * Math.cos(t / 3000 + b.phase), top - 16); ctx.stroke();
      break;
    case 'agents': // antenna with blinking light
      ctx.strokeStyle = '#9aa3bd';
      ctx.beginPath(); ctx.moveTo(cx, top); ctx.lineTo(cx, top - 36); ctx.stroke();
      ctx.fillStyle = live && Math.sin(t / 300) > 0 ? '#ff5d5d' : '#5a2a2a';
      ctx.beginPath(); ctx.arc(cx, top - 37, 3, 0, Math.PI * 2); ctx.fill();
      break;
    case 'mcp': // spire
      poly([[cx - 7, top], [cx + 7, top], [cx, top - 28]], shade(base, 0.25));
      break;
    case 'chat': // neon sign
      ctx.fillStyle = live ? '#ff7aa8' : '#4a2a36';
      if (live) { ctx.shadowColor = '#ff7aa8'; ctx.shadowBlur = 10; }
      ctx.fillRect(cx - 10, top - 13, 20, 8);
      ctx.shadowBlur = 0;
      break;
  }

  // subagents orbit as drones
  const drones = Math.min(s.subagents || 0, 8);
  for (let i = 0; i < drones; i++) {
    const a = (live ? t / 1400 : 0) + b.phase + (i * Math.PI * 2) / drones;
    ctx.fillStyle = live ? '#d8c8ff' : '#4b4560';
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * 30, top - 22 + Math.sin(a) * 10, 2.5, 0, Math.PI * 2); ctx.fill();
  }

  // a live session hitting lots of tool errors is on fire
  if (live && s.turns && s.errors / s.turns > 0.03) {
    for (let i = 0; i < 3; i++) {
      const f = 0.7 + 0.3 * Math.sin(t / 90 + i * 2 + b.phase);
      poly([[cx - 14 + i * 7, top + 2], [cx - 10 + i * 7, top - 12 * f], [cx - 6 + i * 7, top + 2]], i % 2 ? '#ffb347' : '#ff6b3d');
    }
  }

  if (s.status === 'waiting') {
    const p = (t / 900) % 1, y = top - 46;
    ctx.strokeStyle = `rgba(255,210,122,${1 - p})`;
    ctx.beginPath(); ctx.arc(cx, y, 5 + p * 16, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#ffd27a'; ctx.beginPath(); ctx.arc(cx, y, 4, 0, Math.PI * 2); ctx.fill();
  }

  if (s.id === selectedId || s.id === hoverId) {
    ctx.lineWidth = s.id === selectedId ? 2 : 1;
    poly(b.poly, null, s.id === selectedId ? '#ffffff' : 'rgba(255,255,255,.5)');
  }
}

function drawLabels() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = '600 12px system-ui, -apple-system, "Segoe UI", sans-serif';
  ctx.textBaseline = 'middle';
  for (const d of districts) {
    // front corner of the block, so buildings never cover the label
    const [wx, wy] = iso(d.bx + d.w, d.by + d.h);
    const x = wx * view.s + view.x, y = wy * view.s + view.y + 16;
    const text = d.name, w = ctx.measureText(text).width + 16;
    ctx.fillStyle = 'rgba(18,23,38,.85)';
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - 10, w, 20, 10); ctx.fill();
    ctx.fillStyle = '#c9cfdf'; ctx.textAlign = 'center'; ctx.fillText(text, x, y);
  }
}

function frame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (buildings.length) {
    ctx.setTransform(dpr * view.s, 0, 0, dpr * view.s, dpr * view.x, dpr * view.y);
    drawGround();
    for (const b of buildings) drawBuilding(b, t);
    drawLabels();
  }
  requestAnimationFrame(frame);
}

// ---------- view ----------
function resize() {
  dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
}
function fit() {
  if (!buildings.length) return;
  const xs = [iso(0, map.rows)[0], iso(map.cols, 0)[0]];
  const ys = [iso(0, 0)[1] - Math.max(...buildings.map((b) => b.h)) - 50, iso(map.cols, map.rows)[1] + 30];
  const w = xs[1] - xs[0], h = ys[1] - ys[0];
  const availH = innerHeight - 140;
  view.s = Math.max(0.3, Math.min(2.2, Math.min(innerWidth / w, availH / h) * 0.9));
  view.x = innerWidth / 2 - ((xs[0] + xs[1]) / 2) * view.s;
  view.y = 70 + availH / 2 - ((ys[0] + ys[1]) / 2) * view.s;
}
const toWorld = (mx, my) => [(mx - view.x) / view.s, (my - view.y) / view.s];
function hit(mx, my) {
  const p = toWorld(mx, my);
  for (let i = buildings.length - 1; i >= 0; i--) if (inPoly(p, buildings[i].poly)) return buildings[i];
  return null;
}

let drag = null;
canvas.addEventListener('pointerdown', (e) => {
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    if (drag.moved) {
      view.x = drag.vx + dx; view.y = drag.vy + dy;
      canvas.classList.add('dragging'); tip.style.display = 'none';
      return;
    }
  }
  const b = hit(e.clientX, e.clientY);
  hoverId = b?.s.id ?? null;
  canvas.classList.toggle('pointing', !!b);
  if (b && e.pointerType === 'mouse') {
    tip.innerHTML = `<b>${esc(b.s.title || 'Untitled session')}</b><br>` +
      `<span style="color:var(--muted)">${KINDS[b.s.kind].label} · ${STATUS[b.s.status]} · ${ago(b.s.lastActivity)}</span>`;
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 14, innerWidth - 270) + 'px';
    tip.style.top = e.clientY + 14 + 'px';
  } else tip.style.display = 'none';
});
canvas.addEventListener('pointerup', (e) => {
  canvas.classList.remove('dragging');
  if (drag && !drag.moved) {
    const b = hit(e.clientX, e.clientY);
    selectedId = b?.s.id ?? null;
    renderPanel();
  }
  drag = null;
});
canvas.addEventListener('pointerleave', () => { hoverId = null; tip.style.display = 'none'; });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const ns = Math.max(0.25, Math.min(4, view.s * Math.exp(-e.deltaY * 0.0015)));
  view.x = e.clientX - (e.clientX - view.x) * (ns / view.s);
  view.y = e.clientY - (e.clientY - view.y) * (ns / view.s);
  view.s = ns;
}, { passive: false });

// ---------- panel ----------
function findSession(id) {
  for (const d of city?.districts ?? []) for (const s of d.sessions) if (s.id === id) return s;
  return null;
}

function renderPanel() {
  const s = selectedId && findSession(selectedId);
  if (!s) { panel.classList.remove('open'); selectedId = null; return; }
  const k = KINDS[s.kind];
  const tools = Object.entries(s.tools).sort((a, b) => b[1] - a[1]);
  const totalTools = tools.reduce((n, [, c]) => n + c, 0);
  const max = tools[0]?.[1] || 1;
  const stat = (key, v) => `<div class="stat"><div class="k">${key}</div><div class="v">${v}</div></div>`;
  const resume = `cd "${s.cwd}"\nclaude --resume ${s.id}`;
  panel.innerHTML = `
    <button class="close" aria-label="Close">✕</button>
    <div class="pills">
      <span class="pill" style="border-color:${k.color};color:${k.color}">${k.label} · ${k.desc}</span>
      <span class="pill ${s.status}">${STATUS[s.status]}</span>
    </div>
    <h2>${esc(s.title || s.name || 'Untitled session')}</h2>
    <div class="sub">${esc(s.project)}${s.branch ? ' · ' + esc(s.branch) : ''}</div>
    <a class="story" href="/session/${encodeURIComponent(s.id)}" target="_blank" rel="noopener">See what happened in this session →</a>
    <div class="grid">
      ${stat('Your prompts', s.prompts)}
      ${stat('Claude turns', s.turns)}
      ${stat('Tool calls', fmtNum(totalTools))}
      ${stat('Tool errors', s.errors)}
      ${stat('Subagents', s.subagents)}
      ${stat('Output tokens', fmtNum(s.outputTokens))}
      ${s.costUSD != null ? stat('Cost', '$' + s.costUSD.toFixed(2)) : ''}
      ${s.linesAdded != null ? stat('Lines', `+${fmtNum(s.linesAdded)} / −${fmtNum(s.linesRemoved)}`) : ''}
      ${stat('Started', ago(s.startedAt))}
      ${stat('Duration', span(s.startedAt, s.lastActivity))}
    </div>
    <h3>Tools used</h3>
    ${tools.length ? tools.slice(0, 10).map(([n, c]) => `
      <div class="bar"><span class="name" title="${esc(n)}">${esc(n.replace(/^mcp__/, ''))}</span>
      <span class="track"><span class="fill" style="display:block;width:${(c / max) * 100}%;background:${k.color}"></span></span>
      <span class="n">${c}</span></div>`).join('') : '<div class="sub">No tools used.</div>'}
    <h3>Resume this session</h3>
    <pre>${esc(resume)}</pre>
    <button id="copy">Copy command</button>
    <div class="sub" style="margin-top:14px">${esc(s.model || '')} · ${esc(s.id)}</div>`;
  panel.classList.add('open');
  panel.querySelector('.close').onclick = () => { selectedId = null; renderPanel(); };
  panel.querySelector('#copy').onclick = (e) => {
    navigator.clipboard?.writeText(resume).then(() => { e.target.textContent = 'Copied'; });
  };
}

// ---------- data ----------
function renderChrome() {
  const all = city.districts.flatMap((d) => d.sessions).filter(inRange);
  const live = all.filter((s) => s.status !== 'closed').length;
  const waiting = all.filter((s) => s.status === 'waiting').length;
  document.getElementById('stats').innerHTML =
    `<b>${all.length}</b> sessions · <b>${live}</b> live · <b>${districts.length}</b> districts` +
    (waiting ? ` · <span class="needs">${waiting} need you</span>` : '');
}

async function load() {
  try {
    const res = await fetch('/api/city', { cache: 'no-store' });
    city = await res.json();
    if (city.error) throw new Error(city.error);
  } catch (e) {
    document.getElementById('stats').textContent = 'Could not read sessions: ' + e.message;
    return;
  }
  layout();
  if (!fitted && buildings.length) { fit(); fitted = true; }
  renderChrome();
  if (selectedId) renderPanel();
}

document.getElementById('legend').innerHTML = Object.values(KINDS)
  .map((k) => `<div><span class="sw" style="background:${k.color}"></span>${k.label}</div><div class="muted">${k.desc}</div>`)
  .join('');
document.getElementById('range').onchange = (e) => { range = e.target.value; layout(); fit(); renderChrome(); };
document.getElementById('fit').onclick = fit;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { selectedId = null; renderPanel(); } });
addEventListener('resize', resize);

resize();
load();
setInterval(load, 4000);
requestAnimationFrame(frame);
</script>
</body>
</html>
